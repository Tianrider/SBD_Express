version: "3.8"

services:
    # Production configuration for Express app
    app:
        build: .
        restart: unless-stopped
        ports:
            - "3000:3000"
        environment:
            - PORT=3000
            - PG_CONNECTION_STRING=${PG_CONNECTION_STRING}
            - CLOUDINARY_URL=${CLOUDINARY_URL}
            - JWT_SECRET=${JWT_SECRET}
            - REDIS_HOST=${REDIS_HOST}
            - REDIS_PORT=${REDIS_PORT}
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - JWT_EXPIRY=24h
            - NODE_ENV=production
        # Don't mount volumes in production
        volumes: []
        deploy:
            replicas: ${APP_REPLICAS:-1}
            update_config:
                parallelism: 1
                delay: 10s
                order: start-first
            restart_policy:
                condition: on-failure
                max_attempts: 3

volumes:
    redis-data:
        driver: local

networks:
    app-network:
        driver: bridge
