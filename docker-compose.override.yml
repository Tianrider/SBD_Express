version: "3.8"

services:
    # Development configuration for Express app
    app:
        # Use development-specific command
        command: npm run start
        # Mount source code for hot reloading
        volumes:
            - ./:/app
            - /app/node_modules
        # Development environment variables
        environment:
            - NODE_ENV=development
        # Enable debugging
        ports:
            - "9229:9229" # For Node.js debugging
